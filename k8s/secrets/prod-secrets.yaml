apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  namespace: todo-app
type: Opaque
data:
  # Base64 encoded values - these should be replaced with actual values in production
  DATABASE_URL: <YOUR_DATABASE_URL_BASE64_ENCODED>
  OPENAI_API_KEY: <YOUR_OPENAI_API_KEY_BASE64_ENCODED>
  BETTER_AUTH_SECRET: <YOUR_BETTER_AUTH_SECRET_BASE64_ENCODED>