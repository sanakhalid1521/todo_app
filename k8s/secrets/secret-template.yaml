# Secret template for development
# To use: kubectl create secret generic todo-app-secrets --from-file=.env
apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  namespace: default
type: Opaque
data:
  # These values should be base64 encoded
  # Example: echo -n 'your-secret-key' | base64
  DATABASE_URL: <base64-encoded-database-url>
  BETTER_AUTH_SECRET: <base64-encoded-auth-secret>
  OPENAI_API_KEY: <base64-encoded-openai-api-key>
  JWT_ALGORITHM: <base64-encoded-algorithm>
  JWT_EXPIRATION_DAYS: <base64-encoded-expiration-days>