  DATABASE_URL: <DEV_DATABASE_URL_BASE64_ENCODED>
  OPENAI_API_KEY: <DEV_OPENAI_API_KEY_BASE64_ENCODED>
  BETTER_AUTH_SECRET: <DEV_BETTER_AUTH_SECRET_BASE64_ENCODED>