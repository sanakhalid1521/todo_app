# Development values for todo-app

# Backend configuration for development
backend:
  replicaCount: 1
  image:
    repository: todo-backend
    pullPolicy: Never  # For development, use local images
    tag: "dev"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  podAnnotations:
    # Enable reload on file changes
    checksum/config: {{ randAlphaNum 10 | quote }}

  # Pod security context for development
  podSecurityContext: {}
    # fsGroup: 2000

  securityContext: {}
    # Capabilities for file watching in development
    # allowPrivilegeEscalation: true

  service:
    type: ClusterIP
    port: 8000

  ingress:
    enabled: false

  resources:
    # Development resources - higher limits for debugging
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 200m
      memory: 512Mi

  # Add volume mounts for development
  volumes:
    - name: app-code
      hostPath:
        path: /path/to/local/backend  # This should be replaced with actual path
        type: Directory
    - name: app-modules
      emptyDir: {}

  volumeMounts:
    - name: app-code
      mountPath: /app/backend
      subPath: backend
    - name: app-modules
      mountPath: /app/.venv

  # Environment variables
  env:
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: todo-app-secrets
          key: DATABASE_URL
    - name: OPENAI_API_KEY
      valueFrom:
        secretKeyRef:
          name: todo-app-secrets
          key: OPENAI_API_KEY
    - name: BETTER_AUTH_SECRET
      valueFrom:
        secretKeyRef:
          name: todo-app-secrets
          key: BETTER_AUTH_SECRET
    - name: ENVIRONMENT
      value: "development"
    - name: PYTHONUNBUFFERED
      value: "1"

  # Use uvicorn with reload for development
  command: ["uvicorn"]
  args: ["main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "info"]

# Frontend configuration for development
frontend:
  replicaCount: 1
  image:
    repository: todo-frontend
    pullPolicy: Never  # For development, use local images
    tag: "dev"
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

  podAnnotations:
    # Enable reload on file changes
    checksum/config: {{ randAlphaNum 10 | quote }}

  service:
    type: ClusterIP
    port: 3000

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: /
    hosts:
      - host: todo-app.local
        paths:
          - path: /
            pathType: Prefix
    tls: []

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

  # Add volume mounts for development
  volumes:
    - name: app-code
      hostPath:
        path: /path/to/local/frontend  # This should be replaced with actual path
        type: Directory
    - name: node-modules
      emptyDir: {}

  volumeMounts:
    - name: app-code
      mountPath: /app
      subPath: frontend
    - name: node-modules
      mountPath: /app/node_modules

  # Environment variables
  env:
    - name: NEXT_PUBLIC_API_BASE_URL
      value: "http://backend-service:8000"
    - name: NODE_ENV
      value: "development"

# Database configuration (for development with Neon)
database:
  external: true
  url: "postgresql://username:password@ep-xxx.us-east-1.aws.neon.tech/dbname?sslmode=require"

# Global configurations
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""
  appEnv: "development"
  logLevel: "debug"

# Secrets configuration - these should be base64 encoded
secrets:
  databaseUrl: ""  # base64 encoded Neon database URL
  openaiApiKey: ""  # base64 encoded OpenAI API key
  authSecret: ""    # base64 encoded auth secret