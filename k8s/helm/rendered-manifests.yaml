apiVersion: v1
kind: Secret
metadata:
  name: todo-app-secrets
  labels:
    helm.sh/chart: todo-app-0.1.0
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/instance: todo-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
type: Opaque
data:
  # Base64 encoded values - these should be replaced with actual values in production
  DATABASE_URL: "c3dsbGl0ZTovLy8udG9kb19hcHAuZGI="  # sqlite:///./todo_app.db base64 encoded
  OPENAI_API_KEY: "ZHVtbXkta2V5LWZvci1sb2NhbC1kZXBsb3ltZW50"  # dummy-key-for-local-deployment base64 encoded
  BETTER_AUTH_SECRET: "eW91ci12ZXJ5LXNlY3VyZS0zMjQtY2hhcmFjdGVyLXNlY3JldC1rZXktaGVyZS0xMjM0NQ=="  # your-very-secure-32-character-secret-key-here-12345 base64 encoded
---
# Source: todo-app/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  labels:
    helm.sh/chart: todo-app-0.1.0
    app.kubernetes.io/name: todo-app
    app.kubernetes.io/instance: todo-app
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/managed-by: Helm
data:
  # Application settings
  APP_ENV: "minikube"
  LOG_LEVEL: "info"

  # Backend settings
  PORT: "8000"
  HOST: "0.0.0.0"
  DATABASE_TIMEOUT: "30"

  # Frontend settings
  NEXT_PUBLIC_API_BASE_URL: http://backend-service:8000
  NEXT_PUBLIC_APP_NAME: "Todo AI Chatbot"

  # CORS settings
  CORS_ALLOWED_ORIGINS: "http://frontend-service:3000,https://*.example.com"
---
