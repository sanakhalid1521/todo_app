apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-secrets
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values - these should be replaced with actual values in production
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "c3dsbGl0ZTovLy8udG9kb19hcHAuZGI=" | quote }}  # sqlite:///./todo_app.db base64 encoded
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "ZHVtbXkta2V5LWZvci1sb2NhbC1kZXBsb3ltZW50" | quote }}  # dummy-key-for-local-deployment base64 encoded
  BETTER_AUTH_SECRET: {{ .Values.secrets.authSecret | default "eW91ci12ZXJ5LXNlY3VyZS0zMjQtY2hhcmFjdGVyLXNlY3JldC1rZXktaGVyZS0xMjM0NQ==" | quote }}  # your-very-secure-32-character-secret-key-here-12345 base64 encoded