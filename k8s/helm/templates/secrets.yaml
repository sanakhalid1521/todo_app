apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todo-app.fullname" . }}-secrets
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
type: Opaque
data:
  # Base64 encoded values - these should be replaced with actual values in production
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default "<YOUR_DATABASE_URL_BASE64_ENCODED>" | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | default "<YOUR_OPENAI_API_KEY_BASE64_ENCODED>" | quote }}
  BETTER_AUTH_SECRET: {{ .Values.secrets.authSecret | default "<YOUR_BETTER_AUTH_SECRET_BASE64_ENCODED>" | quote }}