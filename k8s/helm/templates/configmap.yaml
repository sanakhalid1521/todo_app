apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "todo-app.fullname" . }}-config
  labels:
    {{- include "todo-app.labels" . | nindent 4 }}
data:
  # Application settings
  APP_ENV: {{ .Values.global.appEnv | default "production" | quote }}
  LOG_LEVEL: {{ .Values.global.logLevel | default "info" | quote }}

  # Backend settings
  PORT: {{ .Values.backend.service.port | quote }}
  HOST: "0.0.0.0"
  DATABASE_TIMEOUT: "30"

  # Frontend settings
  NEXT_PUBLIC_API_BASE_URL: {{ range .Values.frontend.env }}{{ if eq .name "NEXT_PUBLIC_API_BASE_URL" }}{{ .value }}{{ end }}{{ end }}
  NEXT_PUBLIC_APP_NAME: "Todo AI Chatbot"

  # CORS settings
  CORS_ALLOWED_ORIGINS: "http://frontend-service:3000,https://*.example.com"