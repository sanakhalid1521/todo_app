apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-app-monitor
  namespace: monitoring
  labels:
    app: todo-app
spec:
  selector:
    matchLabels:
      app: backend
  namespaceSelector:
    matchNames:
      - todo-app
  endpoints:
  - port: http
    interval: 30s
    path: /metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todo-frontend-monitor
  namespace: monitoring
  labels:
    app: todo-frontend
spec:
  selector:
    matchLabels:
      app: frontend
  namespaceSelector:
    matchNames:
      - todo-app
  endpoints:
  - port: http
    interval: 30s
    path: /metrics