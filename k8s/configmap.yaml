apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-app-config
  namespace: todo-app
data:
  # Application settings
  APP_ENV: "production"
  LOG_LEVEL: "info"

  # Backend settings
  PORT: "8000"
  HOST: "0.0.0.0"
  DATABASE_TIMEOUT: "30"

  # Frontend settings
  NEXT_PUBLIC_API_BASE_URL: "http://backend-service:8000"
  NEXT_PUBLIC_APP_NAME: "Todo AI Chatbot"

  # CORS settings
  CORS_ALLOWED_ORIGINS: "http://frontend-service:3000,https://*.example.com"

  # Health check settings
  HEALTH_CHECK_PATH: "/health"