version: '3.8'

services:
  # Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: todo-app-backend
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./todo_app.db}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-your-32-character-secret-key-here}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_DAYS: 7
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-your-openai-key-here}
      ENVIRONMENT: development
    volumes:
      - ./backend:/app
      - /app/.venv
    networks:
      - todo-network
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--log-level", "info"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: todo-app-frontend
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-32-character-secret-key-here}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  todo_db_volume:

networks:
  todo-network:
    driver: bridge