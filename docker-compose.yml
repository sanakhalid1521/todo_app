services:
  # Backend Server with Neon database
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: todo-app-backend-dev
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://neondb_owner:npg_Ge0rDskgW9VF@ep-dry-tree-adewdlhc-pooler.c-2.us-east-1.aws.neon.tech/neondb?sslmode=require
      - BETTER_AUTH_SECRET=your-very-secure-32-character-secret-key-here-12345
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_DAYS=7
      - CORS_ORIGINS=http://localhost:3001,http://frontend:3000
      - OPENAI_API_KEY=your-openai-api-key-here
    volumes:
      # Bind mount for live code reloading
      - ./backend:/app
      # Mount .env file to use Neon database
      - ./backend/.env:/app/.env
    working_dir: /app
    networks:
      - todo-network
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        python -c \"from app.database import init_db; import asyncio; asyncio.run(init_db()); print('Database initialized')\" &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
      "

  # Frontend Server with bind mounts for development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: todo-app-frontend-dev
    platform: linux/amd64
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_AUTH_SECRET=your-very-secure-32-character-secret-key-here-12345
      - NODE_ENV=development
    depends_on:
      - backend
    volumes:
      # Bind mount individual directories for live code reloading (excluding root files to avoid overwriting startup.sh)
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
      - ./frontend/public:/app/public
      - ./frontend/hooks:/app/hooks
      - ./frontend/lib:/app/lib
      - ./frontend/context:/app/context
      - ./frontend/schemas:/app/schemas
      # Mount individual config files
      - ./frontend/.env:/app/.env
      - ./frontend/.env.local:/app/.env.local
      - ./frontend/.gitignore:/app/.gitignore
      - ./frontend/eslint.config.mjs:/app/eslint.config.mjs
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/next-env.d.ts:/app/next-env.d.ts
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
      - ./frontend/README.md:/app/README.md
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/vercel.json:/app/vercel.json
      - ./frontend/package.json:/app/package.json
      - ./frontend/package-lock.json:/app/package-lock.json
      # Mount node_modules to avoid conflicts
      - /app/node_modules
    working_dir: /app
    networks:
      - todo-network
    # Override the command to run the startup script content directly
    command: sh -c "rm -f .next/cache/lock* && npm run dev"

networks:
  todo-network:
    driver: bridge