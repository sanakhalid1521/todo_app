version: '3.8'

services:
  # Database service (PostgreSQL for production-like environment)
  db:
    image: postgres:15
    container_name: todo-app-db
    platform: linux/amd64
    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Server with bind mounts for development
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.dev
    container_name: todo-app-backend-dev
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/todo_app
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-32-character-secret-key-here}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_DAYS=7
      - CORS_ORIGINS=http://localhost:3001,http://frontend:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your-openai-key-here}
    volumes:
      # Bind mount for live code reloading
      - ./backend:/app
      # Mount .env file
      - ./.env:/app/.env
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - todo-network
    command: >
      sh -c "
        pip install --no-cache-dir -r requirements.txt &&
        python -c \"from database import init_db; import asyncio; asyncio.run(init_db()); print('Database initialized')\" &&
        uvicorn main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app
      "

  # Frontend Server with bind mounts for development
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: todo-app-frontend-dev
    platform: linux/amd64
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_BACKEND_URL=http://backend:8000
      - NEXT_PUBLIC_AUTH_SECRET=${BETTER_AUTH_SECRET:-your-32-character-secret-key-here}
      - NODE_ENV=development
    depends_on:
      - backend
    volumes:
      # Bind mount for live code reloading
      - ./frontend:/app
      # Mount .env file if it exists
      - ./frontend/.env.local:/app/.env.local
      - ./.env:/app/.env
      # Mount node_modules to avoid conflicts
      - /app/node_modules
    working_dir: /app
    networks:
      - todo-network

networks:
  todo-network:
    driver: bridge

volumes:
  postgres_data:

