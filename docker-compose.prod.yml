version: '3.8'

services:
  # Backend Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: todo-app-backend-prod
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_DAYS: 7
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000},http://frontend:3000
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ENVIRONMENT: production
      LOG_LEVEL: info
    restart: unless-stopped
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Frontend Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: todo-app-frontend-prod
    platform: linux/amd64
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${BACKEND_URL:-http://localhost:8000}
      - NEXT_PUBLIC_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - todo-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  todo-network:
    driver: bridge